# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
# golangci-lint configuration for statute.
#
# Conventions:
#   - Enabled lint set is explicit; the default set drifts across releases
#     and tests of "fresh checkout passes lint" become noisy over time.
#   - All linters are errors. We brought the new config in as warnings, fixed
#     the violations in one focused commit, then promoted to errors so the
#     bar is visible from now on.
#   - Test files get a slightly relaxed set: error-checking on every Fprintln
#     and noctx on every httptest call wastes everyone's afternoon.
---
version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: mod
  # The e2e lane is gated behind the e2e build tag so `go test ./...`
  # stays fast and Docker-free; without the tag here the whole lane would
  # be invisible to lint, depguard included.
  build-tags: [e2e]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - fatcontext
    - gocheckcompilerdirectives
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - nakedret
    - nilerr
    - noctx
    - prealloc
    - predeclared
    - reassign
    - revive
    - staticcheck
    - tagalign
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    # golangci-lint custom builds ./custom-gcl; it may produce no output on success.
    # Rebuild custom-gcl whenever the analyzer or its dependencies change.
    # For this repository, make lint is now the canonical command.
    - statutehttp
  # The lifecycle analyzer intentionally starts as a targeted gate: current
  # master contains the startup/lifecycle debt it was written to expose.
  # Lifecycle PRs run make lint-lifecycle; promote it to the default set once
  # that baseline is clean rather than hiding findings behind exclusions.
  disable:
    - statutelifecycle
  settings:
    # The e2e lane is black-box by contract (AGENTS.md): it observes the
    # compiled binary over real sockets. These rules make the boundary
    # enforceable rather than reviewed-for.
    depguard:
      rules:
        # Everything under e2e/: no in-process HTTP shortcuts, no reaching
        # into Statute internals.
        e2e-blackbox:
          files: ["**/e2e/**"]
          deny:
            - pkg: net/http/httptest
              desc: the e2e lane is black-box; drive real listeners over real sockets
            - pkg: statute.kjanat.dev/internal
              desc: e2e must not reach Statute internals
        # The orchestrator, actors, and harness may not import Statute at
        # all; only e2e/cmd/statute (the binary under test) embeds it. The
        # strict allow-list keeps the boundary explicit for future deps.
        e2e-orchestrator:
          list-mode: strict
          files: ["**/e2e/**", "!**/e2e/cmd/statute/**"]
          allow:
            - $gostd
            - statute.kjanat.dev/e2e
            - github.com/quic-go/quic-go
    errcheck:
      check-type-assertions: false
      check-blank: false
    govet:
      enable-all: true
      disable: [fieldalignment, shadow]
    revive:
      rules: [name: var-naming, name: package-comments, { name: exported, severity: warning }]
    gocritic: { disabled-checks: [ifElseChain] }
    gocyclo: { min-complexity: 10 }
    custom:
      statutehttp:
        type: module
        description: Reject ineffective mutations of net/http request special fields through Header.
      statutelifecycle:
        type: module
        description: Trace Statute startup publication, lifecycle goroutine ownership, and cleanup invariants.
    # A switch whose default branch deliberately handles the remaining enum
    # values (e.g. RateLimitKey defaulting to ClientIP) is exhaustive.
    exhaustive: { default-signifies-exhaustive: true }
  exclusions:
    rules:
      # Test relaxation: noctx on every httptest call, error-checking every
      # stub Encode, and http.MethodGet over "GET" in table tests all waste
      # everyone's afternoon. usestdlibvars/noctx still apply to prod code.
      - { path: _test\.go, linters: [errcheck, errchkjson, bodyclose, noctx, revive, goconst, statutehttp, statutelifecycle, usestdlibvars] }
      - { path: examples/, linters: [errcheck] }
      - { path: e2e/cmd/, linters: [errcheck] }
      # The e2e actors deliberately do what gosec flags: read CA roots
      # from a flag-named file, echo request data back, and best-effort
      # close/flush real sockets. They never run outside the lane's
      # private network.
      - { path: e2e/, linters: [gosec] }
      - { path: dns01\.go, linters: [bodyclose] }
