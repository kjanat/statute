#:schema https://mise.jdx.dev/schema/mise.json
#:tombi toml-version = "v1.1.0"

monorepo_root = true

[monorepo]
config_roots = ["research/htmlrewrite"]

[tools]
node = "latest"
npm  = "12"

[tools."github:microsoft/TypeScript"]
version = "7.0.2"

[tools."go:actionlint.kjanat.dev/v2/cmd/actionlint"]
prerelease          = true
version             = "master"
minimum_release_age = "0s"
depends             = ["github:kjanat/shellcheck-rs"]
lazy                = true
lazy_bins           = ["actionlint"]

[tools."github:WebAssembly/binaryen"]
version        = "133"
version_prefix = "version_"
filter_bins    = ["wasm-opt"]

[tools."github:kjanat/dprint"]
prerelease          = true
version             = "latest"
minimum_release_age = "0s"
depends             = ["github:tombi-toml/tombi", "go"]

[tools."golangci-lint"]
version = "2.15.0"
depends = ["go"]

[tools."github:kjanat/runner"]
version = "0.28.0"

[tools."github:tombi-toml/tombi"]
version = "1.9.7"

[tools."github:kjanat/shellcheck-rs"]
matching_regex = '^rshellcheck-.*-(aarch64|armv7|i686|x86_64)-.*\.(tar\.gz|zip)$'
version        = "latest"
rename_exe     = "shellcheck"

[settings]
idiomatic_version_file_enable_tools = ["go", "node", "rust"]
node.npm_shim                       = true
minimum_release_age                 = "0s"
minimum_release_age_excludes        = ["github:kjanat/dprint"]
prereleases                         = true
experimental                        = true

[bootstrap.repos]
wiki = { url = "https://github.com/kjanat/statute.wiki.git" }

# [tasks.actionlint]
# # run = {}
[deps.npm]
auto = true
run  = "npm ci --no-audit --no-fund"

[shell_alias]
kprint = "dprint"
