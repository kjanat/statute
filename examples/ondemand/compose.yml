name: statute-ondemand

services:
  proxy:
    image: statute-ondemand:local
    build:
      context: ../..
      dockerfile: examples/ondemand/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:8081:8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mutations:/var/lib/statute/docker

  origin:
    image: statute-ondemand:local
    entrypoint: ["/origin"]
    restart: "no"
    labels:
      statute.enable: "true"
      statute.service: ondemand-demo
      statute.host: ondemand.local
      statute.port: "7000"

volumes:
  mutations:
