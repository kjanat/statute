# Two Statute servers, one client. statute-2 runs the same image and
# scenario with its own isolated state volume.
volumes:
  statute-2-state:

services:
  statute-2:
    image: ${STATUTE_E2E_IMAGE}
    entrypoint: ["/statute"]
    environment:
      STATUTE_SCENARIO: ${STATUTE_SCENARIO}
      STATUTE_NODE: "2"
    networks: [mesh]
    volumes:
      - statute-2-state:/var/lib/statute
    labels: { statute.e2e: "1" }
