# Real Docker Engine discovery: the statute node reads the host daemon
# through the mounted socket. Discovery is opt-in per container label
# (ExposedByDefault stays off), so only the containers the test launches
# with statute.* labels ever surface as routes.
# This overlay configures only statute-1. The harness rejects multi-server
# Docker scenarios; separate storage would not isolate workload authority.
services:
  statute-1:
    environment:
      STATUTE_WORKLOAD_SERVICE: ${COMPOSE_PROJECT_NAME}-wl
      STATUTE_DISCOVERY_SERVICE: ${COMPOSE_PROJECT_NAME}-dyn
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - statute-workload:/var/lib/statute/docker

volumes:
  statute-workload:
