# A real OpenTelemetry collector with a file exporter onto the shared
# reports mount, so the harness can correlate spans offline.
services:
  otelcol:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/otelcol.yml"]
    user: "0"
    volumes:
      - ./scenarios/observability/otelcol.yml:/etc/otelcol.yml:ro
      - ${E2E_REPORTS}:/reports
    networks: [mesh]
    labels: { statute.e2e: "1", statute.enable: "false" }
