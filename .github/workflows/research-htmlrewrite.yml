name: HTML rewrite research
on:
  pull_request:
    paths:
      - "*.go"
      - go.mod
      - go.sum
      - internal/**
      - resolved/**
      - research/htmlrewrite/**
      - .github/workflows/research-htmlrewrite.yml
  push:
    branches: [master]
    paths:
      - "*.go"
      - go.mod
      - go.sum
      - internal/**
      - resolved/**
      - research/htmlrewrite/**
      - .github/workflows/research-htmlrewrite.yml
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: "htmlrewrite-${{ github.ref }}", cancel-in-progress: true }
jobs:
  experiment:
    name: HTML rewrite (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research/htmlrewrite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: research/htmlrewrite/go.mod
          cache-dependency-path: research/htmlrewrite/go.sum
      - name: Parser-independent cancellation reproducer
        run: |
          CGO_ENABLED=0 go test -v -timeout=2m ./cancelprobe
          CGO_ENABLED=0 go test -run '^$' -bench . -benchtime=500ms -count=3 ./cancelprobe
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build and test cgo-free host and native oracle
        run: make test
      - name: Race detector
        if: matrix.runner == 'ubuntu-latest'
        run: |
          go test -race ./...
          go test -race -tags htmlrewrite_research -run '^TestHTTPDocker' .
          go -C ../.. test -race -tags htmlrewrite_research ./internal/researchroute
          go -C ../.. test -race -tags htmlrewrite_research -run '^TestResearchRoute' .
      - name: Fuzz chunk boundaries
        run: make fuzz
      - name: Benchmark smoke tests
        run: make bench-smoke
      - name: Memory probe smoke test
        run: make memory LOAD_DURATION=1s LOAD_ROUNDS=2 LOAD_WORKERS=2
      - name: Artifact identity
        run: sha256sum artifact/rewriter.wasm
      - name: SIMD experiment parity and limits
        run: |
          make test WASM_RUSTFLAGS='-Ctarget-feature=+simd128'
          sha256sum artifact/rewriter.wasm
      - name: Initial-memory experiment parity and limits
        run: |
          make test WASM_RUSTFLAGS='-Clink-arg=--initial-memory=2097152'
          sha256sum artifact/rewriter.wasm
