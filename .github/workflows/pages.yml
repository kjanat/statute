# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: vanity
on: { push: { branches: [master], paths: [".github/workflows/pages.yml"] } }
permissions: { id-token: write, contents: read, pages: write }
concurrency: { group: pages, cancel-in-progress: true }
env:
  HOST: statute.kjanat.dev
  GODEV: ${{ format('{0}/{1}', 'https://pkg.go.dev', 'statute.kjanat.dev') }}
  REPO: ${{ format('{0}/{1}', github.server_url, github.repository) }}
jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6
      - run: |
          mkdir -p dist
          # Root: tooling reads the go-import/go-source meta; a browser is
          # bounced to the module page on pkg.go.dev.
          cat <<EOF > dist/index.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta name="go-import" content="${HOST} git ${REPO}">
              <meta name="go-source" content="${HOST} ${REPO} ${REPO}/tree/master{/dir} ${REPO}/blob/master{/dir}/{file}#L{line}">
              <meta http-equiv="refresh" content="0; url=${GODEV}">
            </head>
            <body>Redirecting to <a href="${GODEV}">pkg.go.dev</a></body>
          </html>
          EOF
          # Every other path. The go-import meta is path-independent (it
          # always names the module root), so this one file covers every
          # subpackage — no per-folder files to enumerate or keep in sync.
          # GitHub Pages serves it with a 404 status, which go get and
          # proxy.golang.org still parse for the meta tag, so subpackages
          # resolve directly instead of via prefix fallback. Browsers get a
          # path-aware redirect to the exact pkg.go.dev page.
          cat <<EOF > dist/404.html
          <!DOCTYPE html>
          <html>
            <head>
              <meta name="go-import" content="${HOST} git ${REPO}">
              <meta name="go-source" content="${HOST} ${REPO} ${REPO}/tree/master{/dir} ${REPO}/blob/master{/dir}/{file}#L{line}">
              <script>location.replace("${GODEV}" + location.pathname + location.search)</script>
            </head>
            <body>Redirecting to <a href="${GODEV}">pkg.go.dev</a></body>
          </html>
          EOF
      - { uses: actions/upload-pages-artifact@v5, with: { path: dist } }
  deploy:
    needs: build
    runs-on: ubuntu-slim
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps: [{ id: deployment, uses: actions/deploy-pages@v5 }]
