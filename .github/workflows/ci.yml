name: ci
on: { push: { branches: [master] }, pull_request: null }
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
env: { glc: "2.13.1" }
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache: true }
      - run: go vet ./...
      - run: go build ./...
      - { name: race, run: go test -race -coverprofile=cover.out -covermode=atomic ./... }
      - { name: Traefik oracle, run: go -C traefikoracle test ./... }
      - run: go tool cover -func=cover.out
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with: { token: "${{ secrets.CODECOV_TOKEN }}", slug: kjanat/statute, files: ./cover.out, fail_ci_if_error: false }
      - name: upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: cover.out, path: cover.out, if-no-files-found: error, retention-days: 14 }
  lint:
    name: lint
    runs-on: ubuntu-slim
    steps:
      # This job runs repository-controlled commands, so the checkout must
      # not leave a usable token in .git/config for them to reach.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with: { tool_versions: "golangci-lint ${{ env.glc }}" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache: true }
      - uses: kjanat/dprint-check@2a71b9c51a4bd9935243a16de38fa830dbaa30be # v3.0.15
      # golangci-lint-action runs `run`, which never applies the configured
      # formatters. `make fmt-check` and dprint use the same pinned goimports
      # tool, while this explicit step also checks every tracked Go file.
      - { name: format check, run: make fmt-check }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with: { version: "v${{ env.glc }}", args: --timeout=5m }
  lifecycle_lint:
    name: lifecycle lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache: true }
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v${{ env.glc }}
          args: --enable-only=statutelifecycle --new-from-merge-base=origin/${{ github.base_ref }} --whole-files --timeout=5m
  discover_fuzz:
    name: discover fuzz targets
    runs-on: ubuntu-latest
    outputs: { matrix: "${{ steps.targets.outputs.matrix }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache: true }
      - name: discover fuzz targets
        id: targets
        run: |
          set -o pipefail
          go test -json -run='^$' -list='^Fuzz' ./... |
            jq -sc '
              [.[] | select(.Action == "output" and (.Output | test("^Fuzz[A-Za-z0-9_]+\\n$"))) | { package: .Package, target: (.Output | rtrimstr("\n")) }]
              | unique_by(.package, .target) | if length == 0 then error("no fuzz targets found") else {include: .} end
            ' > fuzz-matrix.json
          matrix="$(<fuzz-matrix.json)"
          jq . fuzz-matrix.json
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"
  fuzz:
    name: fuzz (${{ matrix.target }}, 30s)
    needs: discover_fuzz
    runs-on: ubuntu-latest
    strategy: { fail-fast: false, matrix: "${{ fromJSON(needs.discover_fuzz.outputs.matrix) }}" }
    env: { FUZZ_PACKAGE: "${{ matrix.package }}", FUZZ_TARGET: "${{ matrix.target }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache: true }
      - name: run fuzz target
        run: |
          printf '::group::%s\n' "${FUZZ_TARGET}"
          go test -run='^$' -fuzz="^${FUZZ_TARGET}$" -fuzztime=30s "${FUZZ_PACKAGE}"
          echo '::endgroup::'
  examples:
    name: build examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache: true }
      - run: go build ./examples/...
  apidiff:
    name: api surface diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache: true }
      # Diffs the exported surface against the latest release on pkg.go.dev.
      # A deliberate break passes once this step carries
      # env: { APIDIFF_ALLOW_BREAKING: "1" }.
      - run: go run ./scripts/apidiff
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: kjanat/actionlint@7c5b0a3880b3d29c51072b1e5e0730e5988f8b7d # v1
  typecheck:
    name: typecheck scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: "26", cache: npm }
      # comment-cop.yml runs only base-branch tooling, so a PR cannot
      # live-test its own copy; this is the enforceable check on it.
      - { name: typecheck, run: make typecheck }
  e2e:
    name: e2e regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Must exceed E2E_REGRESSION_TIMEOUT so `go test` reports its own
    # timeout instead of the runner killing the job mid-teardown.
    timeout-minutes: 75
    steps:
      # The e2e image builds from the repository root; a persisted
      # credential must not reach the Docker build context.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache: true }
      - { name: vet e2e lane, run: go vet -tags e2e ./e2e/... }
      - { name: test e2e helpers, run: go test -tags e2e ./e2e/cmd/... }
      - { name: smoke + regression tiers, run: make test-e2e-regression }
      # A build or daemon failure legitimately leaves no artifacts; erroring
      # on that would mask the real failure.
      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: e2e-artifacts, path: e2e/artifacts/**, if-no-files-found: warn, retention-days: 14 }
      # The lane's own teardown must leave nothing behind; a sweep that
      # finds anything is a failed invariant, not housekeeping.
      - name: prove no orphans
        if: always()
        run: |
          leaked="$(docker ps -aq --filter label=statute.e2e=1)"
          if [[ -n "${leaked}" ]]; then
            echo "leaked containers: ${leaked}"
            printf '%s\n' "${leaked}" | xargs -r docker rm -f
            exit 1
          fi
