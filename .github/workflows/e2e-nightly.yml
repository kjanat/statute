name: e2e nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: null
permissions: { contents: read }
# Run-level: dedupes whole workflow runs, not the jobs within one run.
concurrency: { group: e2e-nightly, cancel-in-progress: false }
jobs:
  # One job per tier. GitHub-hosted jobs are hard-capped at 360 minutes
  # regardless of timeout-minutes, so the tiers cannot share one job. Each
  # also gets its own runner and Docker daemon, so no tier inherits the
  # wreckage of a tier that timed out.
  regression:
    name: regression scenarios
    runs-on: ubuntu-latest
    # 60m go-test budget + headroom for the image build; well under the cap.
    timeout-minutes: 90
    steps:
      # The e2e image builds from the repository root; a persisted
      # credential must not reach the Docker build context.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache: true }
      # A previous run's wreckage must never turn into this run's failure.
      - { name: sweep before, run: make e2e-clean }
      - { name: regression scenarios, run: make test-e2e-regression }
      # A build or daemon failure legitimately leaves no artifacts; erroring
      # on that would mask the real failure.
      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: e2e-nightly-regression-artifacts, path: e2e/artifacts/**, if-no-files-found: warn, retention-days: 14 }
      - name: prove no orphans
        if: always()
        run: |
          leaked="$(docker ps -aq --filter label=statute.e2e=1)"
          if [[ -n "${leaked}" ]]; then
            echo "leaked containers: ${leaked}"
            printf '%s\n' "${leaked}" | xargs -r docker rm -f
            exit 1
          fi
  repeat:
    name: smoke matrix x20
    runs-on: ubuntu-latest
    # 240m go-test budget + headroom, still short of the 360m runner cap.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache: true }
      - { name: sweep before, run: make e2e-clean }
      # The repetition is the orphan/collision audit: every run ends with a
      # per-project orphan proof and the suite ends with a lane-wide sweep.
      - { name: smoke matrix x20, run: make test-e2e E2E_REPEAT=20 E2E_TIMEOUT=240m }
      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: e2e-nightly-repeat-artifacts, path: e2e/artifacts/**, if-no-files-found: warn, retention-days: 14 }
      - name: prove no orphans
        if: always()
        run: |
          leaked="$(docker ps -aq --filter label=statute.e2e=1)"
          if [[ -n "${leaked}" ]]; then
            echo "leaked containers: ${leaked}"
            printf '%s\n' "${leaked}" | xargs -r docker rm -f
            exit 1
          fi
  soak:
    name: stress/soak tier
    runs-on: ubuntu-latest
    # 120m go-test budget + headroom for the image build.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with: { go-version-file: go.mod, cache: true }
      - { name: sweep before, run: make e2e-clean }
      - { name: stress/soak tier, run: make test-e2e-soak }
      - name: upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with: { name: e2e-nightly-soak-artifacts, path: e2e/artifacts/**, if-no-files-found: warn, retention-days: 14 }
      - name: prove no orphans
        if: always()
        run: |
          leaked="$(docker ps -aq --filter label=statute.e2e=1)"
          if [[ -n "${leaked}" ]]; then
            echo "leaked containers: ${leaked}"
            printf '%s\n' "${leaked}" | xargs -r docker rm -f
            exit 1
          fi
