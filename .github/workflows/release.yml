name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: re-verify tests on the tagged commit
        run: |
          go vet ./...
          go test -race ./...
          go build ./examples/...

      - name: extract changelog entry for this tag
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v tag="$TAG" '
            $0 ~ "^## \\[?" substr(tag,2) "\\]?" { found=1; next }
            found && /^## \[?/ { exit }
            found { print }
          ' CHANGELOG.md > .release-notes.md
          if [ ! -s .release-notes.md ]; then
            echo "no CHANGELOG entry for $TAG; using auto-generated notes"
            echo "use_generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_generated=false" >> "$GITHUB_OUTPUT"
            echo "--- release notes ---"
            cat .release-notes.md
          fi

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.use_generated }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file .release-notes.md
          fi

      - name: warm proxy.golang.org
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error "https://proxy.golang.org/github.com/kjanat/statute/@v/${GITHUB_REF_NAME}.info" > /dev/null; then
              echo "proxy indexed $GITHUB_REF_NAME"
              exit 0
            fi
            echo "proxy not ready, retrying in 10s"
            sleep 10
          done
          echo "proxy did not pick up the tag within 50s; pkg.go.dev may take a few hours"
