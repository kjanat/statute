name: release
on: { push: { tags: ["v*"] } }
permissions: { contents: write }
env: { CNAME: "${{ vars.CNAME }}", TAG: "${{ github.ref_name }}" }
jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./examples/...
      - name: extract changelog entry for this tag
        id: notes
        run: |
          awk -v tag="${TAG}" '
            $0 ~ "^## \\[?" substr(tag,2) "\\]?" { found=1; next }
            found && /^## \[?/ { exit }
            found { print }
          ' CHANGELOG.md > .release-notes.md
          if [[ ! -s .release-notes.md ]]; then
            echo "no CHANGELOG entry for ${TAG}; using auto-generated notes"
            echo "use_generated=true" >> "$GITHUB_ENV"
          else
            echo "use_generated=false" >> "$GITHUB_ENV"
            printf "::group::release notes for ${TAG}\n%s\n::endgroup::" "$(cat .release-notes.md)"
          fi
      - name: create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [[ "${use_generated}" == "true" ]]; then
            gh release create "${TAG}" --verify-tag --title "${TAG}" --generate-notes
          else
            # Append GitHub's generated "What's Changed" + "Full Changelog"
            # below the curated CHANGELOG section.
            gen=$(gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" --jq .body)
            printf '\n\n%s\n' "${gen}" >> .release-notes.md
            gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file .release-notes.md
          fi
      - name: warm proxy.golang.org
        run: |
          for _ in 1 2 3 4 5; do
            if curl --fail --silent --show-error "https://proxy.golang.org/${CNAME}/@v/${GITHUB_REF_NAME}.info" > /dev/null; then
              echo "proxy indexed $GITHUB_REF_NAME"
              exit 0
            fi
            echo "proxy not ready, retrying in 10s"
            sleep 10
          done
          echo "proxy did not pick up the tag within 50s; pkg.go.dev may take a few hours"
