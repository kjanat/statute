# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
---
name: wiki
on:
  push: { branches: [master], paths: ["docs/**", "scripts/wiki-sync.mjs", "mise.toml", ".github/workflows/wiki.yml"] }
  workflow_dispatch: null
permissions: { contents: write }
concurrency: { group: wiki, cancel-in-progress: false }
jobs:
  sync:
    name: sync docs to wiki
    runs-on: ubuntu-slim
    env: { SHA: "${{ github.sha }}" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            id: wiki
            with: { repository: "${{ github.repository }}.wiki", path: wiki, fetch-depth: 0 }
          - name: configure git
            run: |
              git config --global user.name 'github-actions[bot]'
              git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          - uses: kjanat/runner@master
          - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
            with: { bootstrap: true, bootstrap_args: --yes, bootstrap_skip: repos }
      - name: start a generation branch
        working-directory: wiki
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet origin/docs-sync > /dev/null; then
            git switch -C docs-sync origin/docs-sync
          else
            git switch -C docs-sync
          fi

      - name: generate the docs
        run: run docs:generate

      - name: commit the generated docs
        working-directory: wiki
        run: |
          set -euo pipefail
          git add -A Docs
          if git diff --cached --quiet; then
            echo 'the wiki already carries this generation'
            git push origin docs-sync
            exit 0
          fi
          git commit -m "docs: generate from ${SHA}"

      - name: merge the generated docs into the live wiki
        working-directory: wiki
        env: { LIVE: "${{ steps.wiki.outputs.ref }}" }
        run: |
          set -euo pipefail
          git switch "${LIVE#refs/heads/}"
          if ! git merge --no-edit docs-sync; then
            echo '::error::a hand edit collides with a generated page; resolve the files below in the wiki, then re-run'
            git diff --name-only --diff-filter=U
            exit 1
          fi
      - name: push the wiki
        env: { LIVE: "${{ steps.wiki.outputs.ref }}" }
        run: git -C wiki push origin "${LIVE#refs/heads/}" docs-sync
