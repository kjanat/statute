---
name: Comment Cop

# Flags paragraph-length implementation comments added to Go source.
#
# Go declaration documentation is intentionally ignored. Long implementation
# comments are allowed when they document an actual SAFETY:, INVARIANT:,
# PROTOCOL:, or COMPAT: constraint.
#
# Runs entirely against the GitHub API; the diff is read through the API, not
# from a working tree. pull_request_target is safe here because the checkout
# below takes actions/checkout's default ref, which under pull_request_target
# is the BASE branch of the target repository, never the pull request's head.
# The only file executed is scripts/comment-cop.mjs as it exists on the base
# branch: a fork's copy of that script, or any other PR-controlled code, is
# never fetched and never runs. Credentials are not persisted into the
# checkout, and no build, install, or Go toolchain step touches the tree.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment-cop:
    if: >-
      github.repository == 'kjanat/statute' &&
      !github.event.pull_request.draft

    runs-on: ubuntu-latest
    timeout-minutes: 5

    concurrency:
      group: comment-cop-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      # actions/checkout under pull_request_target defaults to the base ref of
      # the target repository, so this is repository-owned code only. The pull
      # request's own copy of the script is never fetched or executed.
      - name: Check out base-branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan diff for paragraph-length implementation comments
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = require("node:url");

            const module = `${process.env.GITHUB_WORKSPACE}/scripts/comment-cop.mjs`;
            const { default: run } = await import(pathToFileURL(module).href);

            await run({ github, context, core });
